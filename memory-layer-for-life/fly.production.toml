# Production API on Fly.io: https://muse-cooper-api.fly.dev
#
# Deploy from memory-layer-for-life/:   .\deploy\deploy.ps1 production
# Settings that are not secret live here, reviewed like code. Secrets (the database URL,
# API keys, the access list) live only in Fly: see deploy/secrets.example.env and
# docs/DEPLOYMENT.md at the repository root. If the app name is taken on Fly, change it
# here and in the app's eas.json (EXPO_PUBLIC_API_URL of the production profile).

app = "muse-cooper-api"
# Ashburn, next to the Neon database in AWS us-east: every request makes several queries.
primary_region = "iad"
# Uvicorn shuts down gracefully on SIGTERM and waits up to 25 s for replies in progress.
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Runs once, in a temporary machine with the new image and these settings, before any
  # traffic moves. A failed migration stops the deploy; the running version keeps serving.
  release_command = "alembic upgrade head"
  release_command_timeout = "5m"
  # One machine is replaced in place: a few seconds without the API, and never two
  # versions running the background loops at once.
  strategy = "rolling"

[env]
  ENVIRONMENT = "production"
  APP_NAME = "muse-api"
  LOG_LEVEL = "INFO"
  # Used only when a user's own timezone is unknown (imports, background work).
  DEFAULT_TIMEZONE = "Asia/Kolkata"

  # Models: Cooper and memory extraction both on Haiku, as tested.
  ANTHROPIC_MODEL = "claude-haiku-5-5"
  ASSISTANT_MODEL = "claude-haiku-5-5"
  ANTHROPIC_TIMEOUT = "30"
  ANTHROPIC_MAX_RETRIES = "3"
  ANTHROPIC_REFUSAL_FALLBACK = "false"

  # Cost guards.
  ASSISTANT_DAILY_PROMPT_LIMIT = "40"
  USAGE_CURRENCY = "INR"
  USAGE_CURRENCY_PER_USD = "88"

  # A small pool per machine; Neon allows far more connections than this uses.
  DB_POOL_SIZE = "5"
  DB_MAX_OVERFLOW = "5"

  # The app is native: browsers never call this API, so no origin is allowed.
  CORS_ORIGINS = "[]"

  # Background work runs inside the API machine (always on, below).
  SCHEDULER_ENABLED = "true"
  PROACTIVE_ENABLED = "true"
  PIPELINE_WORKER_ENABLED = "true"
  RETRIEVAL_INDEXER_ENABLED = "true"
  SOURCE_SYNC_ENABLED = "true"
  PUSH_NOTIFICATIONS_ENABLED = "true"
  MEMORY_CAPTURE_ENABLED = "true"

[http_service]
  internal_port = 8000
  force_https = true
  # Always on: reminders, the daily brief, and scheduled tasks run inside this machine.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  # Liveness, not readiness: a database blip should not take the API out of rotation.
  # The release command has already proven the database is reachable.
  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/api/v1/health/live"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
